name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install backend (editable, dev extras)
        run: cd backend && pip install -e ".[dev]"
      - name: ruff check
        run: cd backend && ruff check .
      - name: pytest
        run: cd backend && pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
        working-directory: frontend
      - name: typecheck + build
        run: npm run typecheck && npm run build
        working-directory: frontend

  # Programmatic (tier-1) eval gate on PRs only. Self-skips when the
  # OPENAI_API_KEY secret isn't configured — until the owner adds the repo
  # secret AND runs `python -m app.evals run --write-baseline` locally to
  # produce backend/app/evals/baseline.json, this job is a no-op that always
  # exits 0. The judge (tier-2) rubric stays a manual/local step per the M4
  # build plan and never runs in CI.
  eval-gate:
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install backend (editable, dev extras)
        run: cd backend && pip install -e ".[dev]"
      - name: programmatic eval gate (skipped without API key)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHEAP_MODE: "1"
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "no OPENAI_API_KEY secret configured — skipping eval gate"
            exit 0
          fi
          cd backend && python -m app.evals run --label "ci pr" --gate
