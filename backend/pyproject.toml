[project]
name = "tracelab-backend"
version = "0.1.0"
description = "tracelab — an agentic data analyst you can watch think (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "scipy>=1.13",
    "langchain-openai>=0.2.10",
    "langchain-core>=0.3.20",
    "sse-starlette>=2.1",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff==0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
